# 로컬 개발용 인프라. API 서버는 hot reload를 위해 호스트에서 실행한다 (./start.sh 또는 make api).
# 호스트 포트는 compose.dev.env에서 정한다 (다른 로컬 프로젝트와 겹치지 않게 배정).
name: keepsake

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: keepsake
      POSTGRES_PASSWORD: keepsake
      POSTGRES_DB: keepsake
    ports:
      - "${POSTGRES_PORT:-15434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keepsake"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Cloudflare R2 대신 쓰는 S3 호환 스토리지 (MinIO 공식 이미지 배포 중단으로 RustFS 사용)
  # 버킷은 `make up`이 backend/scripts/create_bucket.py로 만든다.
  s3:
    image: rustfs/rustfs:1.0.4
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: keepsake
      RUSTFS_SECRET_KEY: keepsake-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${S3_PORT:-9010}:9000"
      - "${S3_CONSOLE_PORT:-9011}:9001"
    volumes:
      - s3-data:/data

volumes:
  postgres-data:
  s3-data:
