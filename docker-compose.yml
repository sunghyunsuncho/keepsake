# 로컬 개발용 인프라. API 서버는 hot reload를 위해 호스트에서 `make api`로 실행한다.
# vernissage와 포트가 겹치지 않도록 5433 / 9010 / 9011을 사용한다.
name: keepsake

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: keepsake
      POSTGRES_PASSWORD: keepsake
      POSTGRES_DB: keepsake
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keepsake"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Cloudflare R2 대신 쓰는 S3 호환 스토리지 (MinIO 공식 이미지 배포 중단으로 RustFS 사용)
  # 버킷은 `make up`이 backend/scripts/create_bucket.py로 만든다.
  s3:
    image: rustfs/rustfs:1.0.4
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: keepsake
      RUSTFS_SECRET_KEY: keepsake-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - s3-data:/data

volumes:
  postgres-data:
  s3-data:
